<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель (упрощённая)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; }
        .admin-header h1 { font-family: var(--display); color: var(--amber); }
        .add-form { display: flex; gap: 10px; background: var(--card); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--line); flex-wrap: wrap; margin-bottom: 30px; }
        .add-form input { padding: 10px 15px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--txt); font-size: 1rem; flex: 1 1 150px; }
        .add-form button { background: var(--amber); color: #241d10; font-weight: bold; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; transition: .2s; }
        .add-form button:hover { transform: scale(1.02); filter: brightness(1.1); }
        .employee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .employee-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; transition: .2s; }
        .employee-card:hover { border-color: var(--amber); transform: translateY(-3px); }
        .employee-card h3 { margin-bottom: 5px; }
        .employee-card .tab { color: var(--mut); font-size: .9rem; margin-bottom: 15px; }
        .employee-card .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .employee-card .actions a, .employee-card .actions button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; text-decoration: none; font-size: .85rem; transition: .2s; }
        .btn-link { background: var(--amber2); color: #241d10; }
        .btn-stats { background: rgba(255,255,255,.1); color: var(--txt); border: 1px solid var(--line); }
        .btn-stats:hover { background: var(--teal); color: #0c1520; }
        .btn-delete { background: rgba(229,72,77,.2); color: var(--red); border: 1px solid var(--red); }
        .btn-delete:hover { background: var(--red); color: #fff; }
        .loading { text-align: center; color: var(--mut); padding: 40px; }
        .auth-screen { display: none; text-align: center; padding: 60px 20px; }
        .auth-screen.active { display: block; }
        .auth-box { max-width: 400px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 12px; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--txt); }
        .auth-box button { width: 100%; padding: 12px; background: var(--amber); color: #241d10; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .auth-box button:hover { filter: brightness(1.1); }
        .auth-error { color: var(--red); margin-top: 10px; }
        .logout-btn { background: var(--red); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .logout-btn:hover { filter: brightness(1.1); }
        .admin-header-right { display: flex; align-items: center; gap: 15px; }
        .notification { position: fixed; bottom: 30px; right: 30px; background: var(--teal); color: #0c1520; padding: 15px 25px; border-radius: 12px; font-weight: bold; opacity: 0; transition: opacity 0.4s; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .notification.show { opacity: 1; }
    </style>
</head>
<body>
<div class="stripe"></div>
<div class="admin-container">

    <!-- ЭКРАН ВХОДА -->
    <div id="authScreen" class="auth-screen active">
        <h1 style="color: var(--amber); margin-bottom: 30px;">🔐 Вход в админ-панель</h1>
        <div class="auth-box">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button id="loginBtn">Войти</button>
            <div id="loginError" class="auth-error"></div>
        </div>
    </div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="adminContent" style="display: none;">
        <div class="admin-header">
            <h1>👨‍💼 Админ-панель</h1>
            <div class="admin-header-right">
                <span style="color:var(--mut)">Управление сотрудниками</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </div>

        <div class="add-form" id="addEmployeeForm">
            <input type="text" id="empName" placeholder="ФИО сотрудника" required>
            <input type="text" id="empPhone" placeholder="Номер телефона" required>
            <button type="submit">➕ Добавить</button>
        </div>

        <div id="employeeList" class="employee-grid">
            <div class="loading">Загрузка...</div>
        </div>
    </div>
</div>

<!-- Уведомление -->
<div id="notification" class="notification"></div>

<!-- Импорт Firebase -->
<script type="module">
    import { firebaseConfig } from './config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
        getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, 
        query, where, onSnapshot, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { 
        getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    console.log('🔥 Firebase инициализирован');

    // ===== ЭЛЕМЕНТЫ =====
    const authScreen = document.getElementById('authScreen');
    const adminContent = document.getElementById('adminContent');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const addForm = document.getElementById('addEmployeeForm');
    const empName = document.getElementById('empName');
    const empPhone = document.getElementById('empPhone');
    const employeeList = document.getElementById('employeeList');
    const notification = document.getElementById('notification');

    // ===== УВЕДОМЛЕНИЯ =====
    function showNotification(msg) {
        notification.textContent = msg;
        notification.classList.add('show');
        clearTimeout(notification._timer);
        notification._timer = setTimeout(() => notification.classList.remove('show'), 2500);
    }

    // ===== АВТОРИЗАЦИЯ =====
    onAuthStateChanged(auth, (user) => {
        console.log('👤 Auth state:', user ? user.email : 'No user');
        if (user) {
            authScreen.classList.remove('active');
            authScreen.style.display = 'none';
            adminContent.style.display = 'block';
            loadEmployees();
        } else {
            authScreen.classList.add('active');
            authScreen.style.display = 'block';
            adminContent.style.display = 'none';
        }
    });

    loginBtn.addEventListener('click', async () => {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();
        if (!email || !password) {
            loginError.textContent = '❌ Введите email и пароль';
            return;
        }
        try {
            await signInWithEmailAndPassword(auth, email, password);
            loginError.textContent = '';
        } catch (e) {
            loginError.textContent = '❌ ' + e.message;
        }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // ===== ЗАГРУЗКА СОТРУДНИКОВ =====
    function loadEmployees() {
        console.log('📋 Загрузка сотрудников...');
        const employeesRef = collection(db, 'salaryEmployees');
        onSnapshot(employeesRef, (snapshot) => {
            console.log('📋 Получено документов:', snapshot.size);
            employeeList.innerHTML = '';
            if (snapshot.empty) {
                employeeList.innerHTML = '<div class="loading">Нет сотрудников. Добавьте первого!</div>';
                return;
            }
            snapshot.forEach((doc) => {
                const emp = { id: doc.id, ...doc.data() };
                console.log('👤 Сотрудник:', emp);
                const card = document.createElement('div');
                card.className = 'employee-card';
                card.innerHTML = `
                    <h3>${emp.name || 'Без имени'}</h3>
                    <div class="tab">📱 ${emp.phone || 'Нет телефона'} · ID: ${emp.id}</div>
                    <div class="actions">
                        <a href="/employee.html?id=${emp.id}" class="btn-link" target="_blank">📊 Калькулятор</a>
                        <button class="btn-stats" onclick="window.showStats('${emp.id}', '${emp.name}')">📈 Статистика</button>
                        <button class="btn-delete" onclick="window.deleteEmployee('${emp.id}')">🗑️</button>
                    </div>
                `;
                employeeList.appendChild(card);
            });
        }, (error) => {
            console.error('❌ Ошибка загрузки:', error);
            employeeList.innerHTML = `<div class="loading" style="color:var(--red);">Ошибка: ${error.message}</div>`;
        });
    }

    // ===== ДОБАВЛЕНИЕ СОТРУДНИКА =====
    addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = empName.value.trim();
        const phone = empPhone.value.trim();
        console.log('📝 Добавление:', name, phone);
        if (!name || !phone) {
            alert('Заполните все поля');
            return;
        }
        if (!auth.currentUser) {
            alert('Вы не авторизованы!');
            return;
        }
        try {
            const docRef = await addDoc(collection(db, 'salaryEmployees'), {
                name: name,
                phone: phone,
                createdAt: new Date().toISOString(),
                adminId: auth.currentUser.uid,
                adminEmail: auth.currentUser.email
            });
            console.log('✅ Добавлен ID:', docRef.id);
            showNotification('✅ Сотрудник добавлен! ID: ' + docRef.id);
            empName.value = '';
            empPhone.value = '';
        } catch (error) {
            console.error('❌ Ошибка:', error);
            alert('Ошибка: ' + error.message);
        }
    });

    // ===== УДАЛЕНИЕ =====
    window.deleteEmployee = async (id) => {
        if (!confirm('Удалить сотрудника?')) return;
        try {
            const weeksRef = collection(db, 'salaryWeeks');
            const q = query(weeksRef, where('employeeId', '==', id));
            const snapshot = await getDocs(q);
            const deletePromises = [];
            snapshot.forEach((doc) => deletePromises.push(deleteDoc(doc.ref)));
            await Promise.all(deletePromises);
            await deleteDoc(doc(db, 'salaryEmployees', id));
            showNotification('🗑️ Сотрудник удален');
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    };

    // ===== СТАТИСТИКА (заглушка) =====
    window.showStats = (id, name) => {
        alert(`Статистика для ${name} (ID: ${id}) пока не реализована.`);
    };

    console.log('✅ admin-simple загружен');
</script>
</body>
</html>
