<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Firestore</title>
    <style>
        body {
            background: #0c1520;
            color: #e9f0f7;
            font-family: sans-serif;
            padding: 30px;
        }
        button {
            background: #ffb52e;
            color: #1c1508;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        pre {
            background: #1a2a3a;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            white-space: pre-wrap;
            font-size: 14px;
        }
        .error { color: #e5484d; }
        .success { color: #3ecfa8; }
    </style>
</head>
<body>
    <h1>🔧 Тест Firestore</h1>
    <button id="testBtn">➕ Добавить тестового сотрудника</button>
    <button id="listBtn">📋 Показать всех сотрудников</button>
    <pre id="log">Ожидание...</pre>

    <script type="module">
        import { firebaseConfig } from './config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const log = document.getElementById('log');

        function addLog(msg, isError = false) {
            log.innerHTML += `<div class="${isError ? 'error' : 'success'}">${msg}</div>`;
            console.log(msg);
        }

        // Проверяем авторизацию
        onAuthStateChanged(auth, (user) => {
            if (user) {
                addLog(`✅ Авторизован: ${user.email} (UID: ${user.uid})`);
            } else {
                addLog('❌ Не авторизован. Попробуйте войти в админку сначала.');
            }
        });

        // Добавление сотрудника
        document.getElementById('testBtn').addEventListener('click', async () => {
            try {
                const user = auth.currentUser;
                if (!user) {
                    addLog('❌ Вы не авторизованы! Войдите в админку.', true);
                    return;
                }

                addLog('🔄 Попытка добавить сотрудника...');

                const docRef = await addDoc(collection(db, 'salaryEmployees'), {
                    name: 'Тест Иванов',
                    phone: '+7 999 111-22-33',
                    test: true,
                    createdAt: new Date().toISOString(),
                    adminId: user.uid,
                    adminEmail: user.email
                });

                addLog(`✅ Сотрудник добавлен! ID документа: ${docRef.id}`);
            } catch (error) {
                addLog(`❌ ОШИБКА: ${error.message}`, true);
                addLog(`📝 Код ошибки: ${error.code}`, true);
                if (error.code === 'permission-denied') {
                    addLog('🔐 Нет прав! Проверьте Security Rules в Firebase.', true);
                }
                console.error(error);
            }
        });

        // Показать всех сотрудников
        document.getElementById('listBtn').addEventListener('click', async () => {
            try {
                addLog('🔄 Загрузка списка...');
                const snapshot = await getDocs(collection(db, 'salaryEmployees'));
                if (snapshot.empty) {
                    addLog('📭 Коллекция пуста. Добавьте сотрудника.');
                } else {
                    addLog(`📊 Найдено ${snapshot.size} сотрудников:`);
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        addLog(`📄 ${doc.id}: ${data.name} (${data.phone || 'нет телефона'})`);
                    });
                }
            } catch (error) {
                addLog(`❌ Ошибка загрузки: ${error.message}`, true);
            }
        });

        // Автоматический тест при загрузке
        addLog('🔍 Проверка подключения к Firebase...');
        setTimeout(() => {
            try {
                if (db) {
                    addLog('✅ Firestore доступен');
                }
            } catch (e) {
                addLog('❌ Ошибка подключения: ' + e.message, true);
            }
        }, 500);
    </script>
</body>
</html>
