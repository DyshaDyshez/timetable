<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 20px;
            min-height: 100vh;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--line);
        }
        .dashboard-header h1 {
            font-family: var(--display);
            color: var(--amber);
            font-size: clamp(1.5rem, 3vw, 2.2rem);
        }
        .dashboard-header .user-info {
            color: var(--mut);
            font-size: .85rem;
        }
        .dashboard-header .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-back {
            background: rgba(255,255,255,.08);
            color: var(--txt);
            border: 1px solid var(--line);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            transition: .2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: rgba(255,181,46,.08);
        }
        .logout-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            filter: brightness(1.1);
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--mut);
            cursor: pointer;
            font-weight: 600;
            font-size: .9rem;
            transition: .2s;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .tab-btn:hover {
            color: var(--txt);
            background: rgba(255,255,255,.05);
        }
        .tab-btn.active {
            background: var(--amber);
            color: #241d10;
        }
        .tab-content {
            display: none;
            animation: fadeIn .3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .table-wrap {
            overflow-x: auto;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--line);
            padding: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            min-width: 700px;
        }
        th {
            text-align: left;
            padding: 12px 12px;
            border-bottom: 2px solid var(--line);
            color: var(--mut);
            font-weight: 600;
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 2;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }
        tr:hover td {
            background: rgba(255,255,255,.03);
        }
        .col-employee {
            font-weight: 600;
            min-width: 120px;
        }
        .col-pay {
            font-weight: 700;
            color: var(--amber);
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
        }
        .status-badge.paid {
            background: rgba(62,207,168,.2);
            color: var(--teal);
        }
        .status-badge.unpaid {
            background: rgba(229,72,77,.2);
            color: var(--red);
        }
        .btn-sm {
            padding: 4px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: .75rem;
            transition: .2s;
            white-space: nowrap;
        }
        .btn-sm.amber {
            background: var(--amber);
            color: #241d10;
        }
        .btn-sm.amber:hover {
            filter: brightness(1.1);
        }
        .btn-sm.teal {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-sm.teal:hover {
            filter: brightness(1.1);
        }
        .btn-sm.ghost {
            background: transparent;
            color: var(--mut);
            border: 1px solid var(--line);
        }
        .btn-sm.ghost:hover {
            border-color: var(--mut);
            color: var(--txt);
        }
        .btn-sm.red {
            background: var(--red);
            color: #fff;
        }
        .btn-sm.red:hover {
            filter: brightness(1.1);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--card);
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--line);
            animation: modalIn .3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-box h2 {
            font-family: var(--display);
            color: var(--amber);
            margin-bottom: 4px;
        }
        .modal-box .sub {
            color: var(--mut);
            font-size: .85rem;
            margin-bottom: 20px;
        }
        .modal-box .field {
            margin-bottom: 14px;
        }
        .modal-box .field label {
            display: block;
            font-size: .75rem;
            color: var(--mut);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .modal-box .field input,
        .modal-box .field select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
            font-size: .95rem;
        }
        .modal-box .field input:focus,
        .modal-box .field select:focus {
            outline: 2px solid var(--amber);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
            text-align: center;
        }
        .modal-actions .btn-amber {
            background: var(--amber);
            color: #241d10;
        }
        .modal-actions .btn-amber:hover {
            filter: brightness(1.1);
        }
        .modal-actions .btn-ghost {
            background: transparent;
            color: var(--mut);
            border: 1px solid var(--line);
        }
        .modal-actions .btn-ghost:hover {
            border-color: var(--mut);
            color: var(--txt);
        }
        .modal-actions .btn-red {
            background: var(--red);
            color: #fff;
        }
        .modal-actions .btn-red:hover {
            filter: brightness(1.1);
        }
        .attendance-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .attendance-day {
            background: var(--card2);
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid var(--line);
        }
        .attendance-day .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: .85rem;
            color: var(--amber2);
            margin-bottom: 6px;
        }
        .attendance-day .day-header .date {
            color: var(--mut);
            font-weight: 400;
            font-size: .75rem;
        }
        .attendance-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,.05);
            flex-wrap: wrap;
        }
        .attendance-row:last-child {
            border-bottom: none;
        }
        .attendance-row .emp-name {
            font-weight: 600;
            min-width: 100px;
            font-size: .9rem;
        }
        .attendance-row .time-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .attendance-row .time-group .time-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: .75rem;
            font-family: var(--mono);
            background: rgba(255,255,255,.05);
            border: 1px solid var(--line);
            cursor: pointer;
            transition: .2s;
        }
        .attendance-row .time-group .time-badge:hover {
            border-color: var(--amber);
        }
        .attendance-row .time-group .time-badge.in {
            color: var(--teal);
            border-color: rgba(62,207,168,.3);
        }
        .attendance-row .time-group .time-badge.out {
            color: var(--red);
            border-color: rgba(229,72,77,.3);
        }
        .attendance-row .time-group .time-badge .edit-hint {
            font-size: .5rem;
            color: var(--mut);
            opacity: 0;
            transition: .2s;
        }
        .attendance-row .time-group .time-badge:hover .edit-hint {
            opacity: 1;
        }
        .attendance-row .actions {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }
        .attendance-row .actions .btn-sm {
            font-size: .65rem;
            padding: 2px 8px;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--mut);
        }
        .week-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .week-selector button {
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--txt);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            transition: .2s;
        }
        .week-selector button:hover {
            border-color: var(--amber);
        }
        .week-selector .week-label {
            font-weight: 600;
            color: var(--amber2);
            font-family: var(--mono);
            font-size: .9rem;
            min-width: 120px;
            text-align: center;
        }
        .loading {
            text-align: center;
            color: var(--mut);
            padding: 40px;
        }
        .debug-btn {
            background: rgba(255,181,46,.15);
            color: var(--amber);
            border: 1px solid var(--amber);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: .7rem;
            transition: .2s;
        }
        .debug-btn:hover {
            background: rgba(255,181,46,.25);
        }
        .bitrix-btn {
            background: var(--amber) !important;
            color: #241d10 !important;
            border: none !important;
            padding: 8px 20px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            font-size: .85rem !important;
            transition: all 0.2s !important;
            margin-left: 8px !important;
        }
        .bitrix-btn:hover {
            filter: brightness(1.1) !important;
            transform: translateY(-2px) !important;
        }
        .bitrix-btn:disabled {
            opacity: 0.6 !important;
            cursor: not-allowed !important;
            transform: none !important;
        }
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .tab-btn {
                font-size: .75rem;
                padding: 8px 14px;
                min-width: 80px;
            }
            table {
                font-size: .75rem;
                min-width: 500px;
            }
            th, td {
                padding: 6px 8px;
            }
            .attendance-row {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .attendance-row .emp-name {
                min-width: auto;
            }
            .attendance-row .actions {
                margin-left: 0;
            }
            .modal-box {
                padding: 20px 16px;
            }
        }
        @media (max-width: 480px) {
            .tab-btn {
                font-size: .7rem;
                padding: 6px 10px;
                min-width: 60px;
                flex: 1 1 auto;
            }
            .tabs {
                gap: 2px;
                padding: 2px;
            }
            .week-selector .week-label {
                font-size: .75rem;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">

        <header class="dashboard-header">
            <h1>👨‍💼 Админ-панель</h1>
            <div class="header-actions">
                <a href="index.html" class="btn-back">← Назад</a>
                <span class="user-info" id="userEmail">Загрузка...</span>
                <button class="logout-btn" id="logoutBtn">Выйти</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="salary">💰 Зарплата</button>
            <button class="tab-btn" data-tab="attendance">📋 Посещаемость</button>
        </div>

        <!-- ЗАРПЛАТА -->
        <div class="tab-content active" id="tabSalary">
            <div class="week-selector">
                <button id="salaryWeekPrev">◀</button>
                <span class="week-label" id="salaryWeekLabel">Неделя</span>
                <button id="salaryWeekNext">▶</button>
                <button class="btn-sm amber" id="refreshSalaryBtn" style="padding:8px 20px;font-size:.85rem;">🔄 Обновить</button>
                <!-- <button class="bitrix-btn" id="sendBitrixBtn">📤 Отправить в Битрикс24</button> -->
                <!-- <button class="bitrix-btn" id="exportReportBtn" style="margin-left:8px;">📤 Экспорт отчёта</button> -->
            </div>
            <div class="table-wrap" id="salaryTableWrap">
                <div class="loading" id="salaryLoading">Загрузка...</div>
            </div>
        </div>

        <!-- ПОСЕЩАЕМОСТЬ -->
        <div class="tab-content" id="tabAttendance">
            <div class="week-selector">
                <button id="attWeekPrev">◀</button>
                <span class="week-label" id="attWeekLabel">Неделя</span>
                <button id="attWeekNext">▶</button>
                <button id="attWeekToday" style="border-color:var(--amber);color:var(--amber);">Сегодня</button>
                <button class="btn-sm teal" id="refreshAttBtn" style="padding:8px 20px;font-size:.85rem;margin-left:auto;">🔄 Обновить</button>
                <button class="debug-btn" id="debugAttBtn" style="margin-left:8px;">🐞 Отладка</button>
            </div>
            <div id="attendanceContent">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h2 id="modalTitle">Заголовок</h2>
            <div class="sub" id="modalSub">Подзаголовок</div>
            <div id="modalBody"></div>
            <div class="modal-actions" id="modalActions">
                <button class="btn btn-amber" id="modalSaveBtn">💾 Сохранить</button>
                <button class="btn btn-ghost" id="modalCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ДНЯ -->
    <div class="modal-overlay" id="editDayModal">
        <div class="modal-box" style="max-width: 450px;">
            <h2 id="editDayTitle">✏️ Редактировать день</h2>
            <div class="sub" id="editDaySub">Измените рабочие часы для сотрудника</div>
            <div id="editDayBody">
                <div class="field">
                    <label>Дата</label>
                    <input type="date" id="editDayDate" readonly style="opacity:0.7;">
                </div>
                <div class="field">
                    <label>Часы работы</label>
                    <input type="number" id="editDayHours" step="0.5" min="0" max="24" placeholder="Например: 8">
                </div>
                <div class="field">
                    <label>Время начала (опционально)</label>
                    <input type="time" id="editDayStart" value="08:00">
                </div>
                <div class="field">
                    <label>Время окончания (опционально)</label>
                    <input type="time" id="editDayEnd" value="17:00">
                </div>
                <div style="font-size:.7rem;color:var(--mut);margin-top:8px;">
                    💡 Если часы = 0 — день станет нерабочим.
                    <br>Если часы > 0 — день станет рабочим с указанными часами.
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-amber" id="editDaySaveBtn">💾 Сохранить</button>
                <button class="btn btn-ghost" id="editDayCancelBtn">Отмена</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin-dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const debugBtn = document.getElementById('debugAttBtn');
            if (debugBtn) {
                debugBtn.addEventListener('click', () => {
                    if (window.debugAttendance) {
                        window.debugAttendance();
                    } else {
                        console.log('⏳ Функция отладки еще не загружена');
                    }
                });
            }
        });
    </script>
</body>
</html>
