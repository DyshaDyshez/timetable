<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История действий</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 20px; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--line);
        }
        .header h1 {
            font-family: var(--display);
            color: var(--amber);
            font-size: clamp(1.5rem, 3vw, 2.2rem);
        }
        .btn-back {
            background: rgba(255,255,255,.08);
            color: var(--txt);
            border: 1px solid var(--line);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            text-decoration: none;
            transition: .2s;
        }
        .btn-back:hover { border-color: var(--amber); color: var(--amber); }

        .log-list { display: flex; flex-direction: column; gap: 8px; }
        .log-item {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            transition: .2s;
        }
        .log-item:hover { border-color: var(--amber); }
        
        .log-left { flex: 1; min-width: 0; }
        .log-action {
            font-weight: 700;
            font-size: .95rem;
            color: var(--amber2);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log-action .icon { font-size: 1.1rem; }
        .log-details {
            font-size: .8rem;
            color: var(--mut);
            word-break: break-word;
        }
        .log-meta {
            font-size: .7rem;
            color: var(--mut);
            text-align: right;
            white-space: nowrap;
            font-family: var(--mono);
            flex-shrink: 0;
        }
        .log-meta .email { color: var(--teal); }

        .loading { text-align: center; padding: 40px; color: var(--mut); }
        .empty { text-align: center; padding: 40px; color: var(--mut); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕒 История действий</h1>
            <a href="admin-dashboard.html" class="btn-back">← Назад</a>
        </div>

        <div id="logList" class="log-list">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from './config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, query, orderBy, limit, onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const listEl = document.getElementById('logList');

        // Названия действий на русском
        const ACTION_LABELS = {
            'advance_approved': { text: 'Выдан аванс', icon: '🏦' },
            'salary_paid': { text: 'Выплачена ЗП', icon: '💰' },
            'settings_changed': { text: 'Изменены настройки', icon: '⚙️' },
            'day_edited': { text: 'Отредактирован день', icon: '✏️' },
            'attendance_deleted': { text: 'Удалены отметки', icon: '🗑️' },
            'employee_added': { text: 'Добавлен сотрудник', icon: '➕' },
            'employee_deleted': { text: 'Удален сотрудник', icon: '❌' },
            'adminLogin': { text: 'Вход в админку', icon: '🔑' },
            'adminLogout': { text: 'Выход из админки', icon: '🚪' },
        };

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            
            // Слушаем последние 100 записей, сортировка по времени (новые сверху)
            const q = query(
                collection(db, 'auditLog'),
                orderBy('timestamp', 'desc'),
                limit(100)
            );
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    listEl.innerHTML = '<div class="empty">Пока нет записей в истории</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const label = ACTION_LABELS[data.action] || { text: data.action, icon: '📌' };
                    
                    // Форматируем время
                    let timeStr = '—';
                    if (data.timestamp) {
                        const date = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp);
                        timeStr = date.toLocaleString('ru-RU', { 
                            day: '2-digit', month: '2-digit', year: '2-digit',
                            hour: '2-digit', minute: '2-digit' 
                        });
                    }
                    
                    // Краткие детали
                    let detailsHtml = '';
                    const d = data.data || {};
                    if (d.employeeName) detailsHtml += `Сотрудник: <b>${d.employeeName}</b>. `;
                    if (d.amount) detailsHtml += `Сумма: <b>${Number(d.amount).toLocaleString()} ₽</b>. `;
                    if (d.date) detailsHtml += `Дата: ${d.date}. `;
                    if (d.hours !== undefined) detailsHtml += `Часы: ${d.hours}ч. `;
                    if (d.deletedCount !== undefined) detailsHtml += `Удалено: ${d.deletedCount}. `;
                    if (d.email) detailsHtml += `Email: ${d.email}. `;
                    
                    html += `
                        <div class="log-item">
                            <div class="log-left">
                                <div class="log-action">
                                    <span class="icon">${label.icon}</span>
                                    <span>${label.text}</span>
                                </div>
                                <div class="log-details">${detailsHtml || '—'}</div>
                            </div>
                            <div class="log-meta">
                                <div class="email">👤 ${data.userEmail || 'unknown'}</div>
                                <div>${timeStr}</div>
                            </div>
                        </div>
                    `;
                });
                
                listEl.innerHTML = html;
            }, (error) => {
                console.error('Ошибка загрузки логов:', error);
                listEl.innerHTML = `<div class="empty">❌ Ошибка: ${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
