<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель зарплаты</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-family: var(--display);
            color: var(--amber);
        }
        .add-form {
            display: flex;
            gap: 10px;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .add-form input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
            font-size: 1rem;
            flex: 1 1 150px;
        }
        .add-form button {
            background: var(--amber);
            color: #241d10;
            font-weight: bold;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }
        .add-form button:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .add-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .employee-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            transition: .2s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .employee-card:hover {
            border-color: var(--amber);
            transform: translateY(-3px);
        }
        .employee-card .emp-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .employee-card .emp-phone {
            color: var(--mut);
            font-size: .9rem;
        }
        .employee-card .emp-id {
            color: var(--mut);
            font-size: .7rem;
            font-family: var(--mono);
            background: rgba(255,255,255,.05);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .employee-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .employee-card .actions a,
        .employee-card .actions button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: .8rem;
            transition: .2s;
            white-space: nowrap;
        }
        .btn-link {
            background: var(--amber2);
            color: #241d10;
        }
        .btn-link:hover {
            filter: brightness(1.1);
        }
        .btn-stats {
            background: rgba(255, 255, 255, .1);
            color: var(--txt);
            border: 1px solid var(--line);
        }
        .btn-stats:hover {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-delete {
            background: rgba(255, 0, 8, 0.37);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .btn-delete:hover {
            background: var(--red);
            color: #fff;
        }
        .btn-copy-link {
            background: rgba(62, 207, 168, .15);
            color: var(--teal);
            border: 1px solid var(--teal);
        }
        .btn-copy-link:hover {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-copy-link.copied {
            background: var(--teal);
            color: #0c1520;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg2);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--line);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            color: var(--txt);
            font-size: 2rem;
            cursor: pointer;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .stats-table th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 2px solid var(--line);
            color: var(--mut);
        }
        .stats-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--line);
        }
        .loading {
            text-align: center;
            color: var(--mut);
            padding: 40px;
        }
        .auth-screen {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }
        .auth-screen.active {
            display: block;
        }
        .auth-box {
            max-width: 400px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--amber);
            color: #241d10;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-box button:hover {
            filter: brightness(1.1);
        }
        .auth-error {
            color: var(--red);
            margin-top: 10px;
        }
        .logout-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .logout-btn:hover {
            filter: brightness(1.1);
        }
        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--teal);
            color: #0c1520;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-family: var(--mono);
        }
        .notification.show {
            opacity: 1;
        }
        .notification.error {
            background: var(--red);
            color: #fff;
        }
        .link-hint {
            font-size: .65rem;
            color: var(--mut);
            margin-top: 2px;
            word-break: break-all;
            cursor: pointer;
        }
        .link-hint:hover {
            color: var(--amber);
        }
    </style>
</head>
<body>
    <div class="stripe"></div>
    <div class="admin-container">

        <!-- ЭКРАН ВХОДА -->
        <div id="authScreen" class="auth-screen active">
            <h1 style="color: var(--amber); margin-bottom: 30px;">🔐 Вход в админ-панель</h1>
            <div class="auth-box">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button id="loginBtn">Войти</button>
                <div id="loginError" class="auth-error"></div>
            </div>
        </div>

        <!-- АДМИН-ПАНЕЛЬ -->
        <div id="adminContent" style="display: none;">
            <div class="admin-header">
                <h1>👨‍💼 Админ-панель</h1>
                <div class="admin-header-right">
                    <span style="color:var(--mut)" id="userEmail">Управление сотрудниками</span>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>
            </div>

            <div class="add-form" id="addEmployeeForm">
                <input type="text" id="empName" placeholder="ФИО сотрудника" required>
                <input type="text" id="empPhone" placeholder="Номер телефона" required>
                <button type="button" id="addBtn">➕ Добавить</button>
            </div>

            <div id="employeeList" class="employee-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script type="module">
        import { firebaseConfig } from './config.js';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, doc, getDocs, addDoc, updateDoc, deleteDoc, 
            query, where, onSnapshot, getDoc 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        import { renderStats } from './stats-module.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.doc = doc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.query = query;
        window.where = where;
        window.onSnapshot = onSnapshot;
        window.getDoc = getDoc;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
        window.showNotification = showNotification;

        console.log('🚀 Админ-панель загружена');

        function showNotification(message, isError = false) {
            const el = document.getElementById('notification');
            if (!el) return;
            el.textContent = message;
            el.className = 'notification show';
            if (isError) el.classList.add('error');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        function getBaseUrl() {
            const url = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');
            return url;
        }

        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btnElement.textContent;
                btnElement.textContent = '✅ Скопировано!';
                btnElement.classList.add('copied');
                setTimeout(() => {
                    btnElement.textContent = originalText;
                    btnElement.classList.remove('copied');
                }, 2000);
                showNotification('✅ Ссылка скопирована!');
            } catch (error) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    const originalText = btnElement.textContent;
                    btnElement.textContent = '✅ Скопировано!';
                    btnElement.classList.add('copied');
                    setTimeout(() => {
                        btnElement.textContent = originalText;
                        btnElement.classList.remove('copied');
                    }, 2000);
                    showNotification('✅ Ссылка скопирована!');
                } catch (err) {
                    showNotification('❌ Не удалось скопировать', true);
                }
                document.body.removeChild(textarea);
            }
        }

        // Авторизация
        onAuthStateChanged(auth, (user) => {
            console.log('👤 Auth state:', user ? user.email : 'No user');
            const authScreen = document.getElementById('authScreen');
            const adminContent = document.getElementById('adminContent');
            const userEmail = document.getElementById('userEmail');
            
            if (user) {
                authScreen.classList.remove('active');
                authScreen.style.display = 'none';
                adminContent.style.display = 'block';
                if (userEmail) userEmail.textContent = '👤 ' + user.email;
                loadEmployees();
            } else {
                authScreen.classList.add('active');
                authScreen.style.display = 'block';
                adminContent.style.display = 'none';
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');
            try {
                await signInWithEmailAndPassword(auth, email, password);
                errorEl.textContent = '';
                showNotification('✅ Вход выполнен!');
            } catch (error) {
                errorEl.textContent = '❌ ' + error.message;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // Показ статистики через модуль
        window.showStats = async (employeeId, employeeName) => {
            try {
                await renderStats(employeeId, employeeName, db, collection, doc, query, where, getDocs, getDoc, showNotification);
            } catch (error) {
                console.error('❌ Ошибка статистики:', error);
                showNotification('❌ Ошибка загрузки статистики', true);
            }
        };

        // Загрузка сотрудников
        function loadEmployees() {
            const employeesRef = collection(db, 'salaryEmployees');
            onSnapshot(employeesRef, (snapshot) => {
                const container = document.getElementById('employeeList');
                container.innerHTML = '';
                if (snapshot.empty) {
                    container.innerHTML = '<div class="loading">Нет сотрудников. Добавьте первого!</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const emp = { id: doc.id, ...doc.data() };
                    const baseUrl = getBaseUrl();
                    const employeeLink = baseUrl + 'employee.html?id=' + emp.id;
                    
                    const card = document.createElement('div');
                    card.className = 'employee-card';
                    card.innerHTML = `
                        <div>
                            <div class="emp-name">${emp.name || 'Без имени'}</div>
                            <div class="emp-phone">📱 ${emp.phone || 'Нет телефона'}</div>
                        </div>
                        <div class="actions">
                            <!-- <a href="employee.html?id=${emp.id}" class="btn-link" target="_blank">📊 Калькулятор</a> -->
                            <button class="btn-copy-link" data-link="${employeeLink}">📋 Ссылка</button>
                            <button class="btn-stats" onclick="window.showStats('${emp.id}', '${emp.name}')">📈 Статистика</button>
                            <button class="btn-delete" onclick="window.deleteEmployee('${emp.id}')">🗑️</button>
                        </div>
                        <div class="link-hint" id="linkHint_${emp.id}">${employeeLink}</div>
                    `;
                    container.appendChild(card);

                    const copyBtn = card.querySelector('.btn-copy-link');
                    copyBtn.addEventListener('click', function() {
                        const link = this.dataset.link;
                        copyToClipboard(link, this);
                    });

                    const hint = card.querySelector('.link-hint');
                    hint.addEventListener('click', function() {
                        const link = this.textContent;
                        const btn = this.parentElement.querySelector('.btn-copy-link');
                        copyToClipboard(link, btn);
                    });
                });
            });
        }

        // ============================================
        // ДОБАВЛЕНИЕ СОТРУДНИКА
        // ============================================
        
        const addBtn = document.getElementById('addBtn');
        const nameInput = document.getElementById('empName');
        const phoneInput = document.getElementById('empPhone');

        if (addBtn) {
            addBtn.addEventListener('click', async () => {
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                
                if (!name || !phone) {
                    showNotification('❌ Заполните все поля!', true);
                    return;
                }

                if (!auth.currentUser) {
                    showNotification('❌ Вы не авторизованы!', true);
                    return;
                }

                addBtn.disabled = true;
                addBtn.textContent = '⏳ Сохранение...';

                try {
                    const docRef = await addDoc(collection(db, 'salaryEmployees'), {
                        name: name,
                        phone: phone,
                        createdAt: new Date().toISOString(),
                        adminId: auth.currentUser.uid,
                        adminEmail: auth.currentUser.email
                    });
                    
                    nameInput.value = '';
                    phoneInput.value = '';
                    
                    const baseUrl = getBaseUrl();
                    const link = baseUrl + 'employee.html?id=' + docRef.id;
                    showNotification('✅ Сотрудник добавлен! Ссылка: ' + link);
                    
                } catch (error) {
                    console.error('❌ ОШИБКА:', error);
                    showNotification('❌ ' + error.message, true);
                } finally {
                    addBtn.disabled = false;
                    addBtn.textContent = '➕ Добавить';
                }
            });
        }

        // Удаление сотрудника
        window.deleteEmployee = async (id) => {
            if (!confirm('🗑️ Удалить сотрудника и все его данные?')) return;
            try {
                const q = query(collection(db, 'salaryWeeks'), where('employeeId', '==', id));
                const snapshot = await getDocs(q);
                for (const doc of snapshot.docs) {
                    await deleteDoc(doc.ref);
                }
                await deleteDoc(doc(db, 'salaryEmployees', id));
                showNotification('🗑️ Удалено');
            } catch (error) {
                showNotification('❌ ' + error.message, true);
            }
        };

        console.log('✅ Админ-панель готова к работе!');
    </script>
</body>
</html>
