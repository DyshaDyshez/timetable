<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель зарплаты</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-family: var(--display);
            color: var(--amber);
        }
        .add-form {
            display: flex;
            gap: 10px;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .add-form input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
            font-size: 1rem;
            flex: 1 1 150px;
        }
        .add-form button {
            background: var(--amber);
            color: #241d10;
            font-weight: bold;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }
        .add-form button:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .employee-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            transition: .2s;
        }
        .employee-card:hover {
            border-color: var(--amber);
            transform: translateY(-3px);
        }
        .employee-card h3 {
            margin-bottom: 5px;
        }
        .employee-card .tab {
            color: var(--mut);
            font-size: .9rem;
            margin-bottom: 15px;
        }
        .employee-card .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .employee-card .actions a,
        .employee-card .actions button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: .85rem;
            transition: .2s;
        }
        .btn-link {
            background: var(--amber2);
            color: #241d10;
        }
        .btn-stats {
            background: rgba(255, 255, 255, .1);
            color: var(--txt);
            border: 1px solid var(--line);
        }
        .btn-stats:hover {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-delete {
            background: rgba(229, 72, 77, .2);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .btn-delete:hover {
            background: var(--red);
            color: #fff;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg2);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--line);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            color: var(--txt);
            font-size: 2rem;
            cursor: pointer;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .stats-table th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 2px solid var(--line);
            color: var(--mut);
        }
        .stats-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--line);
        }
        .stats-table .paid {
            color: var(--teal);
        }
        .stats-table .unpaid {
            color: var(--red);
        }
        .loading {
            text-align: center;
            color: var(--mut);
            padding: 40px;
        }
        .auth-screen {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }
        .auth-screen.active {
            display: block;
        }
        .auth-box {
            max-width: 400px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--amber);
            color: #241d10;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-box button:hover {
            filter: brightness(1.1);
        }
        .auth-error {
            color: var(--red);
            margin-top: 10px;
        }
        .logout-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .logout-btn:hover {
            filter: brightness(1.1);
        }
        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="stripe"></div>
    <div class="admin-container">

        <!-- ЭКРАН ВХОДА -->
        <div id="authScreen" class="auth-screen active">
            <h1 style="color: var(--amber); margin-bottom: 30px;">🔐 Вход в админ-панель</h1>
            <div class="auth-box">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button id="loginBtn">Войти</button>
                <div id="loginError" class="auth-error"></div>
            </div>
        </div>

        <!-- АДМИН-ПАНЕЛЬ -->
        <div id="adminContent" style="display: none;">
            <div class="admin-header">
                <h1>👨‍💼 Админ-панель</h1>
                <div class="admin-header-right">
                    <span style="color:var(--mut)">Управление сотрудниками</span>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>
            </div>

            <div class="add-form" id="addEmployeeForm">
                <input type="text" id="empName" placeholder="ФИО сотрудника" required>
                <input type="text" id="empTab" placeholder="Табельный номер" required>
                <button type="submit">➕ Добавить</button>
            </div>

            <div id="employeeList" class="employee-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Модалка статистики -->
    <div class="modal" id="statsModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2 id="statsName">Статистика сотрудника</h2>
            <div style="overflow-x:auto;">
                <table class="stats-table" id="statsTable">
                    <thead>
                        <tr>
                            <th>Неделя</th>
                            <th>Раб. дней</th>
                            <th>Часов</th>
                            <th>Переработка</th>
                            <th>Зарплата (₽)</th>
                            <th>Статус</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="statsBody">
                        <tr><td colspan="7" style="text-align:center;color:var(--mut);">Нет данных</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Импорт конфига -->
    <script type="module">
        // Импортируем конфиг из файла config.js (который НЕ в Git)
        import { firebaseConfig } from './config.js';
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.doc = doc;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.query = query;
        window.where = where;
        window.onSnapshot = onSnapshot;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.onAuthStateChanged = onAuthStateChanged;
        window.signOut = signOut;
    </script>
    <script type="module" src="admin.js"></script>
</body>
</html>
