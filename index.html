<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель зарплаты</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .admin-header h1 {
            font-family: var(--display);
            color: var(--amber);
        }
        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .add-form {
            display: flex;
            gap: 10px;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--line);
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .add-form input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
            font-size: 1rem;
            flex: 1 1 150px;
        }
        .add-form button {
            background: var(--amber);
            color: #241d10;
            font-weight: bold;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
        }
        .add-form button:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }
        .add-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .employee-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px;
            transition: .2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .employee-card:hover {
            border-color: var(--amber);
            transform: translateY(-3px);
        }
        .employee-card .emp-name {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .employee-card .emp-phone {
            color: var(--mut);
            font-size: .9rem;
        }
        .employee-card .emp-pin {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--mono);
            margin: 4px 0;
        }
        .employee-card .emp-pin .pin-display {
            font-weight: bold;
            color: var(--amber2);
            padding: 2px 10px;
            background: rgba(255,181,46,.1);
            border-radius: 4px;
            border: 1px solid rgba(255,181,46,.3);
            min-width: 40px;
            text-align: center;
        }
        .employee-card .emp-pin .pin-edit-input {
            width: 60px;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
            font-family: var(--mono);
            text-align: center;
            font-size: .9rem;
        }
        .employee-card .emp-pin .pin-btn {
            background: none;
            border: none;
            color: var(--mut);
            cursor: pointer;
            font-size: .8rem;
            padding: 0 4px;
            transition: .2s;
        }
        .employee-card .emp-pin .pin-btn:hover {
            color: var(--amber);
        }
        .employee-card .emp-pin .pin-btn.save {
            color: var(--teal);
        }
        .employee-card .emp-pin .pin-btn.save:hover {
            color: #4ae0b0;
        }
        .employee-card .emp-pin .pin-btn.generate {
            color: var(--amber);
        }
        .employee-card .emp-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .employee-card .emp-actions button {
            padding: 6px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: .8rem;
            transition: .2s;
            white-space: nowrap;
        }
        .btn-copy-link {
            background: rgba(62, 207, 168, .15);
            color: var(--teal);
            border: 1px solid var(--teal);
        }
        .btn-copy-link:hover {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-stats {
            background: rgba(255,255,255,.1);
            color: var(--txt);
            border: 1px solid var(--line);
        }
        .btn-stats:hover {
            background: var(--teal);
            color: #0c1520;
        }
        .btn-delete {
            background: rgba(255,0,8,0.37);
            color: var(--red);
            border: 1px solid var(--red);
        }
        .btn-delete:hover {
            background: var(--red);
            color: #fff;
        }
        .btn-generate-all {
            background: var(--amber);
            color: #241d10;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: .8rem;
            transition: .2s;
        }
        .btn-generate-all:hover {
            filter: brightness(1.1);
        }
        .btn-generate-all:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .logout-btn {
            background: var(--red);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .logout-btn:hover {
            filter: brightness(1.1);
        }
        .link-hint {
            font-size: .6rem;
            color: var(--mut);
            word-break: break-all;
            cursor: pointer;
        }
        .link-hint:hover {
            color: var(--amber);
        }
        .auth-screen {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }
        .auth-screen.active {
            display: block;
        }
        .auth-box {
            max-width: 400px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
        }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: var(--bg2);
            color: var(--txt);
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: var(--amber);
            color: #241d10;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-box button:hover {
            filter: brightness(1.1);
        }
        .auth-error {
            color: var(--red);
            margin-top: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg2);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--line);
            position: relative;
        }
        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            color: var(--txt);
            font-size: 2rem;
            cursor: pointer;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .stats-table th {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 2px solid var(--line);
            color: var(--mut);
        }
        .stats-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--line);
        }
        .loading {
            text-align: center;
            color: var(--mut);
            padding: 40px;
        }
        .finance-tab {
            margin-top: 40px;
            border-top: 2px solid var(--line);
            padding-top: 30px;
        }
        .finance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }
        .finance-header h2 {
            font-family: var(--display);
            font-weight: 400;
            color: var(--amber);
        }
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--teal);
            color: #0c1520;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            font-family: var(--mono);
        }
        .notification.show {
            opacity: 1;
        }
        .notification.error {
            background: var(--red);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="stripe"></div>
    <div class="admin-container">

        <!-- ЭКРАН ВХОДА -->
        <div id="authScreen" class="auth-screen active">
            <h1 style="color: var(--amber); margin-bottom: 30px;">🔐 Вход в админ-панель</h1>
            <div class="auth-box">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button id="loginBtn">Войти</button>
                <div id="loginError" class="auth-error"></div>
            </div>
        </div>

        <!-- АДМИН-ПАНЕЛЬ -->
        <div id="adminContent" style="display: none;">
            <div class="admin-header">
                <h1>👨‍💼 Админ-панель</h1>
                <div class="admin-header-right">
                    <span style="color:var(--mut)" id="userEmail">Управление сотрудниками</span>
               <!--       <button id="generateAllPinsBtn" class="btn-generate-all">🔢 PIN для всех</button>  -->
               <a href="admin-dashboard.html" class="btn btn-amber" style="padding:8px 20px;">📊 Расширенная панель</a>
                    <button class="logout-btn" id="logoutBtn">Выйти</button>
                </div>
            </div>

            <div class="add-form" id="addEmployeeForm">
                <input type="text" id="empName" placeholder="ФИО сотрудника" required>
                <input type="text" id="empPhone" placeholder="Номер телефона" required>
                <button type="button" id="addBtn">➕ Добавить</button>
            </div>

            <div id="employeeList" class="employee-grid">
                <div class="loading">Загрузка...</div>
            </div>

            <div class="finance-tab" id="financeTab">
                <div class="finance-header">
                    <h2>💰 Финансы</h2>
                    <button id="showAllDebtsBtn" class="btn btn-amber" style="padding: 8px 20px; font-size: .8rem;">📊 Все долги</button>
                </div>
                <div id="financeSummary">
                    <div class="loading">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script type="module" src="admin.js"></script>
</body>
</html>
